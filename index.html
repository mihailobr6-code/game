<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФИТС — ИИ по математике</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .chat {
    width: 100%;
    max-width: 600px;
    height: 85vh;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #2a5298, #1e3c72);
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 46px; height: 46px;
    background: #fff;
    color: #2a5298;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 18px;
  }
  .header h1 { font-size: 20px; }
  .header p { font-size: 12px; opacity: .8; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #f4f7fb;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: opacity .35s ease;
  }
  .messages.clearing { opacity: 0; }
  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fade .3s ease;
  }
  @keyframes fade { from {opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }
  .bot {
    background: #fff;
    color: #1e3c72;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .user {
    background: #2a5298;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .input-area {
    display: flex;
    padding: 14px;
    background: #fff;
    border-top: 1px solid #e0e6ef;
    gap: 10px;
  }
  .input-area input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e0e6ef;
    border-radius: 30px;
    font-size: 15px;
    outline: none;
    transition: border .2s;
  }
  .input-area input:focus { border-color: #2a5298; }
  .input-area button {
    background: #2a5298;
    color: #fff;
    border: none;
    padding: 0 22px;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
    transition: background .2s;
  }
  .input-area button:hover { background: #1e3c72; }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: #c4d0e3; border-radius: 8px; }

  .broom-overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 120px; pointer-events: none; opacity: 0;
    transition: opacity .3s ease;
  }
  .broom-overlay.show { opacity: 1; animation: sweep 0.9s ease; }
  @keyframes sweep {
    0%   { transform: translateX(-200px) rotate(-20deg); opacity: 0; }
    40%  { transform: translateX(0) rotate(10deg); opacity: 1; }
    100% { transform: translateX(200px) rotate(20deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="broom-overlay" id="broom">🧹</div>

<div class="chat">
  <div class="header">
    <div class="avatar">Ф</div>
    <div>
      <h1>ФИТС</h1>
      <p>ИИ по математике • онлайн</p>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input id="input" type="text" placeholder="Напиши пример, уравнение или 'помощь'..." autocomplete="off">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
/* ============ МОЗГ ФИТС ============ */
const FITS = {
  name: "ФИТС",
  version: "1.1",

  help() {
    return `📚 Что я умею:
• Считать примеры В ЛЮБОМ ТЕКСТЕ:
  «сколько будет 2+2?» → 4
  «реши 5*3 пожалуйста» → 15
• Уравнения: x+5=12, 2*x=10
• Корни: sqrt(16), степени: 5^2
• Тригонометрия: sin(0), cos(0)
• Факториал: 5!
• Площадь круга: круг 5
• Очистить чат: очистить
• Помощь: помощь`;
  },

  /* 🎯 Ищем математический пример внутри любого текста */
  extractExpression(text) {
    // 1) Сначала — уравнение с "=" и "x"
    const eqMatch = text.match(/([\d\.\*\(\)\sxX]+)\s*=\s*([\d\.\*\(\)\s\+\-]+)/);
    if (eqMatch && /x/i.test(eqMatch[1])) {
      return { type: "equation", value: eqMatch[0].replace(/\s+/g, "") };
    }

    // 2) Факториал: "5!"
    const factMatch = text.match(/(\d+)\s*!/);
    if (factMatch) {
      return { type: "factorial", value: factMatch[1] };
    }

    // 3) Площадь круга: "круг 5"
    const circleMatch = text.match(/круг\s*([\d.]+)/i);
    if (circleMatch) {
      return { type: "circle", value: circleMatch[1] };
    }

    // 4) Обычный пример: цифры + операторы (возможно с sqrt/sin/cos/tan/pi)
    //    Ищем самую длинную последовательность цифр/операторов/функций
    const exprPattern = /(?:sqrt|sin|cos|tan|log|abs|pi|\d|[+\-*/^().,\s])+/gi;
    const candidates = text.match(exprPattern) || [];

    let best = null;
    for (let c of candidates) {
      // В примере должна быть хотя бы одна цифра и один оператор
      if (!/\d/.test(c)) continue;
      if (!/[+\-*/^]|sqrt|sin|cos|tan|log|abs|pi/i.test(c)) continue;
      // Не должно быть одиночной цифры/слова
      if (c.replace(/[\s]/g, "").length < 2) continue;

      const cleaned = c.trim();
      if (!best || cleaned.length > best.length) best = cleaned;
    }

    if (best) return { type: "expr", value: best.trim() };
    return null;
  },

  calc(expr) {
    try {
      let e = expr
        .replace(/\^/g, "**")
        .replace(/,/g, ".")
        .replace(/pi/gi, "Math.PI")
        .replace(/\be\b/g, "Math.E")
        .replace(/sqrt\(/gi, "Math.sqrt(")
        .replace(/sin\(/gi, "Math.sin(")
        .replace(/cos\(/gi, "Math.cos(")
        .replace(/tan\(/gi, "Math.tan(")
        .replace(/log\(/gi, "Math.log(")
        .replace(/abs\(/gi, "Math.abs(");

      if (!/^[0-9+\-*/().\sMathPIEsqrtincolgb]+$/.test(e)) {
        return "❌ Недопустимые символы в выражении.";
      }

      const result = Function('"use strict"; return (' + e + ')')();
      if (typeof result !== "number" || !isFinite(result)) {
        return "❌ Не могу посчитать это выражение.";
      }
      const clean = Number.isInteger(result) ? result : Math.round(result * 1e10) / 1e10;
      return `✅ ${expr.trim()} = ${clean}`;
    } catch (err) {
      return "❌ Не могу посчитать: " + err.message;
    }
  },

  equation(eq) {
    try {
      const [left, right] = eq.split("=");
      if (!left || !right) return "❌ Пример: 2*x+5=11";
      const m = left.replace(/\s/g, "").match(/^([\d.]*)\*?x([+\-][\d.]+)?$/i);
      if (!m) return "❌ Пока решаю только ax+b=c. Пример: 2*x+5=11";
      const a = parseFloat(m[1] || "1");
      const b = m[2] ? parseFloat(m[2]) : 0;
      const c = Function('"use strict"; return (' + right + ')')();
      const x = (c - b) / a;
      const clean = Number.isInteger(x) ? x : Math.round(x * 1e6) / 1e6;
      return `✅ x = ${clean}`;
    } catch (err) {
      return "❌ Ошибка в уравнении: " + err.message;
    }
  },

  factorial(n) {
    n = parseInt(n);
    if (isNaN(n) || n < 0) return "❌ Факториал только для целых ≥ 0";
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return `✅ ${n}! = ${r}`;
  },

  circle(r) {
    r = parseFloat(r);
    if (isNaN(r)) return "❌ Пример: круг 5";
    const s = Math.PI * r * r;
    return `✅ Площадь круга с радиусом ${r}:\nS = π·r² = ${Math.round(s * 10000) / 10000}`;
  },

  /* 🧠 Главный метод: сначала пример, потом слова */
  respond(msg) {
    const text = msg.trim();
    const low = text.toLowerCase();
    if (!text) return "Напиши что-нибудь 🙂";

    // 1) Явные команды (обрабатываем ДО поиска примера,
    //    чтобы "очистить" не путалось ни с чем)
    if (["помощь", "help", "?"].includes(low)) return this.help();
    if (low === "привет" || low === "здравствуй") {
      return "Привет! Я ФИТС 🤖 Напиши пример — решу. Или «помощь» для списка команд.";
    }

    // 2) 🎯 Ищем пример в тексте (даже если есть слова вокруг)
    const found = this.extractExpression(text);
    if (found) {
      // Небольшая подпись, чтобы было видно, что ФИТС нашёл пример
      let prefix = "";
      const hasExtraWords = /[а-яё]/i.test(
        text.replace(/круг|sqrt|sin|cos|tan|log|abs|pi/gi, "")
      );
      if (hasExtraWords) prefix = "🔎 Нашёл пример в твоём сообщении:\n";

      if (found.type === "equation") return prefix + this.equation(found.value);
      if (found.type === "factorial") return prefix + this.factorial(found.value);
      if (found.type === "circle")    return prefix + this.circle(found.value);
      return prefix + this.calc(found.value);
    }

    // 3) Примера нет — отвечаем на слово
    if (low.startsWith("круг")) return this.circle(low.replace("круг", "").trim());
    if (low.includes("как дела")) return "Отлично! Готов считать 📐";
    if (low.includes("спасибо")) return "Пожалуйста! 😊";

    return "🤔 Я не нашёл математический пример. Напиши что-то вроде «2+2» или «сколько будет 5*3?»";
  }
};

/* ============ ИНТЕРФЕЙС ============ */
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const broomEl = document.getElementById("broom");

function addMsg(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function clearChat() {
  broomEl.classList.add("show");
  messagesEl.classList.add("clearing");
  setTimeout(() => {
    messagesEl.innerHTML = "";
    messagesEl.classList.remove("clearing");
    broomEl.classList.remove("show");
    addMsg("🧹 Чат очищен! Я снова как новенький.\nЧем помочь? Напиши «помощь».", "bot");
  }, 400);
}

function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  const low = text.toLowerCase();

  // 🧹 Пасхалка очистки
  if (["очистить", "очисть", "очисти", "clear", "clean"].includes(low)) {
    addMsg(text, "user");
    inputEl.value = "";
    setTimeout(clearChat, 250);
    return;
  }

  addMsg(text, "user");
  inputEl.value = "";
  setTimeout(() => addMsg(FITS.respond(text), "bot"), 250);
}

inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

addMsg(
  "👋 Привет! Я ФИТС — ИИ по математике (v" + FITS.version + ").\n" +
  "Пиши как удобно — я найду пример в любом тексте:\n" +
  "  «сколько будет 2+2?»\n" +
  "  «реши пожалуйста 5*3»\n" +
  "  «x+5=12»\n" +
  "Напиши «помощь» для полного списка. 💡 Попробуй «очистить» 🧹",
  "bot"
);
</script>
</body>
</html>
