<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФИТС — ИИ по математике</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .chat {
    width: 100%;
    max-width: 600px;
    height: 85vh;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #2a5298, #1e3c72);
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 46px; height: 46px;
    background: #fff;
    color: #2a5298;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 18px;
  }
  .header h1 { font-size: 20px; }
  .header p { font-size: 12px; opacity: .8; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #f4f7fb;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: opacity .35s ease;
  }
  .messages.clearing {
    opacity: 0;
  }
  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fade .3s ease;
  }
  @keyframes fade { from {opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }
  .bot {
    background: #fff;
    color: #1e3c72;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .user {
    background: #2a5298;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .input-area {
    display: flex;
    padding: 14px;
    background: #fff;
    border-top: 1px solid #e0e6ef;
    gap: 10px;
  }
  .input-area input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e0e6ef;
    border-radius: 30px;
    font-size: 15px;
    outline: none;
    transition: border .2s;
  }
  .input-area input:focus { border-color: #2a5298; }
  .input-area button {
    background: #2a5298;
    color: #fff;
    border: none;
    padding: 0 22px;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
    transition: background .2s;
  }
  .input-area button:hover { background: #1e3c72; }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: #c4d0e3; border-radius: 8px; }

  /* Анимация "веника" при очистке */
  .broom-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 120px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .broom-overlay.show {
    opacity: 1;
    animation: sweep 0.9s ease;
  }
  @keyframes sweep {
    0%   { transform: translateX(-200px) rotate(-20deg); opacity: 0; }
    40%  { transform: translateX(0) rotate(10deg); opacity: 1; }
    100% { transform: translateX(200px) rotate(20deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="broom-overlay" id="broom">🧹</div>

<div class="chat">
  <div class="header">
    <div class="avatar">Ф</div>
    <div>
      <h1>ФИТС</h1>
      <p>ИИ по математике • онлайн</p>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input id="input" type="text" placeholder="Напиши пример, уравнение или 'помощь'..." autocomplete="off">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
/* ============ МОЗГ ФИТС ============ */
const FITS = {
  name: "ФИТС",
  version: "1.0",

  help() {
    return `📚 Что я умею:
• Считать: 2+2*3, (5+5)/2, 2^10
• Уравнения: x+5=12, 2*x=10
• Корни: sqrt(16), степени: 5^2
• Тригонометрия: sin(0), cos(0), tan(0)
• Факториал: 5!
• Площадь круга: круг 5
• Очистить чат: очистить
• Помощь: помощь`;
  },

  calc(expr) {
    try {
      let e = expr
        .replace(/\^/g, "**")
        .replace(/,/g, ".")
        .replace(/pi/g, "Math.PI")
        .replace(/\be\b/g, "Math.E")
        .replace(/sqrt\(/g, "Math.sqrt(")
        .replace(/sin\(/g, "Math.sin(")
        .replace(/cos\(/g, "Math.cos(")
        .replace(/tan\(/g, "Math.tan(")
        .replace(/log\(/g, "Math.log(")
        .replace(/abs\(/g, "Math.abs(");

      if (!/^[0-9+\-*/().\sMathPIEsqrtincolgb]+$/.test(e)) {
        return "❌ Недопустимые символы в выражении.";
      }

      const result = Function('"use strict"; return (' + e + ')')();
      const clean = Number.isInteger(result) ? result : Math.round(result * 1e10) / 1e10;
      return `✅ ${expr} = ${clean}`;
    } catch (err) {
      return "❌ Не могу посчитать: " + err.message;
    }
  },

  equation(eq) {
    try {
      const [left, right] = eq.split("=");
      if (!left || !right) return "❌ Пример: 2*x+5=11";
      const m = left.replace(/\s/g, "").match(/^([\d.]*)\*?x([+\-][\d.]+)?$/i);
      if (!m) return "❌ Пока решаю только ax+b=c. Пример: 2*x+5=11";
      const a = parseFloat(m[1] || "1");
      const b = m[2] ? parseFloat(m[2]) : 0;
      const c = Function('"use strict"; return (' + right + ')')();
      const x = (c - b) / a;
      const clean = Number.isInteger(x) ? x : Math.round(x * 1e6) / 1e6;
      return `✅ x = ${clean}`;
    } catch (err) {
      return "❌ Ошибка в уравнении: " + err.message;
    }
  },

  factorial(n) {
    n = parseInt(n);
    if (isNaN(n) || n < 0) return "❌ Факториал только для целых ≥ 0";
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return `✅ ${n}! = ${r}`;
  },

  circle(r) {
    r = parseFloat(r);
    if (isNaN(r)) return "❌ Пример: круг 5";
    const s = Math.PI * r * r;
    return `✅ Площадь круга с радиусом ${r}:\nS = π·r² = ${Math.round(s * 10000) / 10000}`;
  },

  respond(msg) {
    const text = msg.trim().toLowerCase();
    if (!text) return "Напиши что-нибудь 🙂";
    if (["помощь", "help", "?"].includes(text)) return this.help();
    if (text === "привет" || text === "здравствуй") return "Привет! Я ФИТС 🤖 Что посчитаем?";
    if (text.startsWith("круг")) return this.circle(text.replace("круг", "").trim());
    if (/^[\d\s!]+$/.test(text)) return this.factorial(text.replace(/\s/g, ""));
    if (text.includes("=") && text.includes("x")) return this.equation(text);
    return this.calc(msg);
  }
};

/* ============ ИНТЕРФЕЙС ============ */
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const broomEl = document.getElementById("broom");

function addMsg(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* 🧹 ПАСХАЛКА: очистка чата */
function clearChat() {
  // Показываем веник
  broomEl.classList.add("show");

  // Плавно гасим сообщения
  messagesEl.classList.add("clearing");

  setTimeout(() => {
    messagesEl.innerHTML = "";
    messagesEl.classList.remove("clearing");
    broomEl.classList.remove("show");

    // Приветствие после очистки
    addMsg(
      "🧹 Чат очищен! Я снова как новенький.\n" +
      "Чем помочь? Напиши «помощь» для списка команд.",
      "bot"
    );
  }, 400);
}

function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  // 🪄 Пасхалка срабатывает на "очистить" (и пару вариантов)
  const low = text.toLowerCase();
  if (["очистить", "очисть", "очисти", "clear", "clean"].includes(low)) {
    addMsg(text, "user");
    inputEl.value = "";
    setTimeout(clearChat, 250);
    return;
  }

  addMsg(text, "user");
  inputEl.value = "";

  setTimeout(() => {
    addMsg(FITS.respond(text), "bot");
  }, 250);
}

inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

// Приветствие
addMsg(
  "👋 Привет! Я ФИТС — твой ИИ-помощник по математике (v" + FITS.version + ").\n" +
  "Могу считать примеры, решать уравнения, строить площади.\n" +
  "Напиши «помощь», чтобы увидеть все команды.\n" +
  "💡 Подсказка: попробуй написать «очистить» 🧹",
  "bot"
);
</script>
</body>
</html>
