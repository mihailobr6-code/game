<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 ИИ по математике — голос и текст</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 20px;
    padding: 25px;
    width: 100%;
    max-width: 650px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 {
    text-align: center;
    color: #1e3c72;
    margin: 0 0 15px;
    font-size: 22px;
  }

  /* Переключатель озвучки */
  .toggle-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 15px;
    font-size: 14px;
    color: #444;
  }
  .toggle-row input { width: 18px; height: 18px; cursor: pointer; }

  /* Чат */
  #chat {
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    padding: 15px;
    height: 340px;
    overflow-y: auto;
    margin-bottom: 15px;
    background: #f9f9f9;
  }
  .msg {
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    animation: fadeIn 0.3s;
    word-wrap: break-word;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .user { background: #d1e7ff; color: #0b3d91; margin-left: 40px; }
  .ai   { background: #e8f5e9; color: #1b5e20; margin-right: 40px; }
  .system { background: #fff3cd; color: #856404; text-align: center; font-size: 13px; }

  /* Кнопка "прослушать" у ответа ИИ */
  .speak-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    margin-left: 6px;
    padding: 2px 6px;
    border-radius: 6px;
    transition: background 0.2s;
  }
  .speak-btn:hover { background: rgba(0,0,0,0.08); }

  /* Поле ввода + кнопки */
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  #textInput {
    flex: 1;
    padding: 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: border 0.2s;
  }
  #textInput:focus { border-color: #2a5298; }

  .buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    padding: 12px 16px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  #sendBtn   { background: #2a5298; color: white; flex: 1; }
  #sendBtn:hover { background: #1e3c72; }
  #micBtn    { background: #2a5298; color: white; flex: 1; }
  #micBtn:hover { background: #1e3c72; }
  #micBtn.listening {
    background: #e53935;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(229,57,53,0.7); }
    50% { box-shadow: 0 0 0 15px rgba(229,57,53,0); }
  }
  #stopBtn  { background: #ff9800; color: white; }
  #clearBtn { background: #757575; color: white; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    text-align: center;
    margin-top: 12px;
    color: #666;
    font-size: 14px;
    min-height: 20px;
  }
  .status.listening { color: #e53935; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <h1>📐 ИИ-помощник по математике</h1>

  <!-- Переключатель озвучки -->
  <div class="toggle-row">
    <input type="checkbox" id="voiceToggle" checked>
    <label for="voiceToggle">🔊 Озвучивать ответы голосом</label>
  </div>

  <div id="chat">
    <div class="msg system">Напиши вопрос или нажми 🎤 и скажи голосом</div>
  </div>

  <!-- Текстовый ввод -->
  <div class="input-row">
    <input id="textInput" type="text" placeholder="Введи математический вопрос..." autocomplete="off">
    <button id="sendBtn">➤ Отправить</button>
  </div>

  <!-- Голосовые кнопки -->
  <div class="buttons">
    <button id="micBtn">🎤 Говорить</button>
    <button id="stopBtn" disabled>⏹ Стоп</button>
    <button id="clearBtn">🗑 Очистить</button>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
// ============================================================
// НАСТРОЙКИ — ВСТАВЬ СВОЙ API-КЛЮЧ
// ============================================================
const API_KEY = "ТВОЙ_API_КЛЮЧ";
const API_URL = "https://api.deepseek.com/chat/completions";
const MODEL   = "deepseek-chat";

// ============================================================
// Элементы
// ============================================================
const chatEl       = document.getElementById("chat");
const textInput    = document.getElementById("textInput");
const sendBtn      = document.getElementById("sendBtn");
const micBtn       = document.getElementById("micBtn");
const stopBtn      = document.getElementById("stopBtn");
const clearBtn     = document.getElementById("clearBtn");
const statusEl     = document.getElementById("status");
const voiceToggle  = document.getElementById("voiceToggle");

// ============================================================
// Распознавание речи (STT)
// ============================================================
let recognition = null;
let isListening = false;

function setupRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    addMessage("❌ Браузер не поддерживает распознавание речи. Используй Chrome/Edge или пиши текстом.", "system");
    micBtn.disabled = true;
    return null;
  }
  const rec = new SR();
  rec.lang = "ru-RU";
  rec.continuous = false;
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    isListening = true;
    micBtn.classList.add("listening");
    micBtn.textContent = "🔴 Слушаю...";
    stopBtn.disabled = false;
    setStatus("Слушаю ваш вопрос...", true);
  };

  rec.onresult = (event) => {
    const text = event.results[0][0].transcript.trim();
    setStatus("");
    if (text) {
      addMessage("👤 Ты: " + text, "user");
      askAI(text);
    } else {
      addMessage("🤖 Не разобрал, попробуй снова.", "system");
    }
  };

  rec.onerror = (e) => {
    setStatus("");
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      addMessage("❌ Нет доступа к микрофону. Разреши его в браузере.", "system");
    } else if (e.error === "no-speech") {
      addMessage("🔇 Ничего не услышал. Попробуй ещё раз.", "system");
    } else {
      addMessage("⚠️ Ошибка распознавания: " + e.error, "system");
    }
  };

  rec.onend = () => {
    isListening = false;
    micBtn.classList.remove("listening");
    micBtn.textContent = "🎤 Говорить";
    stopBtn.disabled = true;
    setStatus("");
  };

  return rec;
}

// ============================================================
// Синтез речи (TTS)
// ============================================================
let voices = [];
function loadVoices() { voices = window.speechSynthesis.getVoices(); }
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
  if (!voiceToggle.checked) return;      // озвучка выключена
  if (!window.speechSynthesis) return;

  window.speechSynthesis.cancel();

  const clean = text
    .replace(/[*_`#>]/g, "")
    .replace(/\n+/g, ". ");

  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = "ru-RU";
  utter.rate = 1.0;
  utter.pitch = 1.0;

  const ruVoice = voices.find(v => v.lang.startsWith("ru"));
  if (ruVoice) utter.voice = ruVoice;

  window.speechSynthesis.speak(utter);
}

// ============================================================
// Запрос к ИИ
// ============================================================
let isBusy = false;

async function askAI(question) {
  if (isBusy) return;
  isBusy = true;
  sendBtn.disabled = true;
  micBtn.disabled = true;
  setStatus("🤔 Думаю...", true);

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [
          {
            role: "system",
            content: (
              "Ты — ИИ-помощник по математике. Отвечай ТОЛЬКО на математические вопросы " +
              "(арифметика, алгебра, геометрия, тригонометрия, производные, интегралы, " +
              "статистика и т.п.). Решай пошагово и понятно. Ответ может читаться голосом — " +
              "не используй сложную разметку (markdown, LaTeX). " +
              "Если вопрос не по математике — вежливо откажись."
            )
          },
          { role: "user", content: question }
        ],
        temperature: 0.3
      })
    });

    if (!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();
    const answer = data.choices?.[0]?.message?.content?.trim() || "Пустой ответ от ИИ.";

    // Добавляем ответ + кнопку "прослушать"
    addAIMessage(answer);
    speak(answer);

  } catch (err) {
    console.error(err);
    addMessage("⚠️ Ошибка запроса: " + err.message, "system");
  } finally {
    setStatus("");
    sendBtn.disabled = false;
    micBtn.disabled = false;
    isBusy = false;
  }
}

// ============================================================
// Добавление сообщений
// ============================================================
function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// Ответ ИИ + отдельная кнопка "прослушать" (работает даже если автоозвучка выключена)
function addAIMessage(text) {
  const div = document.createElement("div");
  div.className = "msg ai";

  const span = document.createElement("span");
  span.textContent = "🤖 ИИ: " + text;
  div.appendChild(span);

  const btn = document.createElement("button");
  btn.className = "speak-btn";
  btn.title = "Прослушать ответ";
  btn.textContent = "🔊";
  btn.addEventListener("click", () => {
    // Временно игнорируем переключатель, чтобы можно было послушать вручную
    const old = voiceToggle.checked;
    voiceToggle.checked = true;
    speak(text);
    voiceToggle.checked = old;
  });
  div.appendChild(btn);

  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function setStatus(text, listening = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("listening", listening);
}

// ============================================================
// Отправка из текстового поля
// ============================================================
function sendFromText() {
  const q = textInput.value.trim();
  if (!q) return;
  window.speechSynthesis.cancel();       // прервать текущую озвучку
  addMessage("👤 Ты: " + q, "user");
  textInput.value = "";
  askAI(q);
}

sendBtn.addEventListener("click", sendFromText);
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendFromText();
});

// ============================================================
// Голосовой ввод
// ============================================================
recognition = setupRecognition();

micBtn.addEventListener("click", () => {
  if (!recognition) return;
  if (isListening) {
    recognition.stop();
  } else {
    window.speechSynthesis.cancel();
    try { recognition.start(); } catch (e) { /* уже идёт */ }
  }
});

stopBtn.addEventListener("click", () => {
  if (recognition && isListening) recognition.stop();
  window.speechSynthesis.cancel();
});

clearBtn.addEventListener("click", () => {
  window.speechSynthesis.cancel();
  chatEl.innerHTML = '<div class="msg system">Чат очищен. Задай новый вопрос!</div>';
});
</script>
</body>
</html>
