<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧮 Математический ИИ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6a11cb 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  
  .container {
    width: 100%;
    max-width: 600px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    overflow: hidden;
    backdrop-filter: blur(10px);
  }
  
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 24px;
    text-align: center;
  }
  
  .header h1 { font-size: 26px; margin-bottom: 6px; }
  .header p { opacity: 0.9; font-size: 14px; }
  
  .chat {
    height: 400px;
    overflow-y: auto;
    padding: 20px;
    background: #f7f9fc;
  }
  
  .message {
    margin-bottom: 14px;
    display: flex;
    animation: slideIn 0.3s ease;
  }
  
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .message.user { justify-content: flex-end; }
  
  .bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  
  .user .bubble {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-bottom-right-radius: 4px;
  }
  
  .bot .bubble {
    background: white;
    color: #333;
    border: 1px solid #e0e6ed;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  
  .bot .bubble.error { border-color: #ff6b6b; color: #d63031; }
  .bot .bubble.success { border-color: #00b894; }
  
  .input-area {
    display: flex;
    padding: 16px;
    background: white;
    border-top: 1px solid #e0e6ed;
    gap: 10px;
  }
  
  #userInput {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e0e6ed;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    transition: border 0.2s;
  }
  
  #userInput:focus { border-color: #667eea; }
  
  #sendBtn {
    padding: 12px 24px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s;
  }
  
  #sendBtn:hover { transform: scale(1.05); }
  #sendBtn:active { transform: scale(0.97); }
  
  .hints {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 16px 16px;
    background: white;
  }
  
  .hint {
    padding: 6px 12px;
    background: #eef2ff;
    color: #4c51bf;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid #c7d2fe;
    transition: all 0.2s;
  }
  
  .hint:hover { background: #667eea; color: white; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🧮 Математический ИИ</h1>
    <p>Решаю примеры, уравнения и объясняю шаги</p>
  </div>
  
  <div class="chat" id="chat">
    <div class="message bot">
      <div class="bubble">
        Привет! Я математический ИИ 🤖<br>
        Могу: считать выражения, решать уравнения, объяснять шаги.<br>
        Попробуй: <b>2+2</b>, <b>sqrt(16)</b>, <b>x^2-5*x+6=0</b>
      </div>
    </div>
  </div>
  
  <div class="hints">
    <span class="hint" onclick="quick('2+2*3')">2+2*3</span>
    <span class="hint" onclick="quick('sqrt(144)')">sqrt(144)</span>
    <span class="hint" onclick="quick('2^10')">2^10</span>
    <span class="hint" onclick="quick('sin(pi/2)')">sin(pi/2)</span>
    <span class="hint" onclick="quick('5!')">5!</span>
    <span class="hint" onclick="quick('x^2-5*x+6=0')">уравнение</span>
  </div>
  
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Введи пример..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
// ============ МАТЕМАТИЧЕСКИЙ ИИ ============

const chat = document.getElementById('chat');
const input = document.getElementById('userInput');

// Ввод по Enter
input.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});

function quick(expr) {
  input.value = expr;
  sendMessage();
}

function addMessage(text, sender, type = '') {
  const msg = document.createElement('div');
  msg.className = 'message ' + sender;
  msg.innerHTML = `<div class="bubble ${type}">${text}</div>`;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

// ============ ФАКТОРИАЛ ============
function factorial(n) {
  if (n < 0) return NaN;
  if (n > 170) return Infinity;
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

// ============ БЕЗОПАСНЫЙ ПАРСЕР ВЫРАЖЕНИЙ ============
// Заменяем ^ на **, ! на factorial, функции на Math.*
function prepareExpression(expr) {
  let e = expr.trim();
  
  // Убираем пробелы для парсинга
  e = e.replace(/\s+/g, '');
  
  // Факториалы: 5! -> factorial(5)
  e = e.replace(/(\d+)!/g, 'factorial($1)');
  
  // Степени: 2^10 -> 2**10
  e = e.replace(/\^/g, '**');
  
  // Математические константы
  e = e.replace(/\bpi\b/g, 'Math.PI');
  e = e.replace(/\be\b/g, 'Math.E');
  
  // Функции
  const funcs = ['sqrt', 'sin', 'cos', 'tan', 'asin', 'acos', 'atan',
                 'log', 'log10', 'log2', 'abs', 'exp', 'floor', 'ceil', 'round'];
  funcs.forEach(f => {
    e = e.replace(new RegExp('\\b' + f + '\\b', 'g'), 'Math.' + f);
  });
  
  return e;
}

// ============ РЕШЕНИЕ ВЫРАЖЕНИЯ ============
function solveExpression(expr) {
  try {
    const prepared = prepareExpression(expr);
    
    // Проверка на недопустимые символы
    if (/[^0-9+\-*/().,%MathsqrtincosabexpflorudPIE]/.test(prepared)) {
      return { ok: false, text: '❌ Недопустимые символы в выражении' };
    }
    
    // Вычисляем
    const result = Function('"use strict"; return (' + prepared + ')')();
    
    if (typeof result !== 'number' || isNaN(result)) {
      return { ok: false, text: '❌ Не число или ошибка' };
    }
    
    // Красивый вывод
    const rounded = Math.abs(result) < 1e-10 ? 0 : 
                    Math.round(result * 1e10) / 1e10;
    
    return { ok: true, text: `✅ ${expr} = <b>${rounded}</b>`, value: rounded };
  } catch (err) {
    if (expr.includes('/0')) return { ok: false, text: '❌ Деление на ноль!' };
    return { ok: false, text: '❌ Ошибка: ' + err.message };
  }
}

// ============ РЕШЕНИЕ КВАДРАТНЫХ УРАВНЕНИЙ ============
function solveQuadratic(a, b, c) {
  const D = b*b - 4*a*c;
  
  if (Math.abs(D) < 1e-10) {
    const x = -b / (2*a);
    return `✅ D = 0<br>Один корень:<br><b>x = ${round(x)}</b>`;
  }
  
  if (D > 0) {
    const x1 = (-b + Math.sqrt(D)) / (2*a);
    const x2 = (-b - Math.sqrt(D)) / (2*a);
    return `✅ D = b² - 4ac = ${round(D)} > 0<br>
            Два корня:<br><b>x₁ = ${round(x1)}</b><br><b>x₂ = ${round(x2)}</b>`;
  }
  
  const re = -b / (2*a);
  const im = Math.sqrt(-D) / (2*a);
  return `✅ D = ${round(D)} < 0<br>Комплексные корни:<br>
          <b>x₁ = ${round(re)} + ${round(im)}i</b><br>
          <b>x₂ = ${round(re)} - ${round(im)}i</b>`;
}

function round(n) {
  return Math.round(n * 1e6) / 1e6;
}

// Разбор уравнения вида "ax^2 + bx + c = 0"
function parseQuadratic(equation) {
  try {
    let eq = equation.replace(/\s+/g, '').replace(/\*/g, '');
    
    // Приводим к виду = 0
    let left = eq, right = '0';
    if (eq.includes('=')) {
      [left, right] = eq.split('=');
    }
    
    // Переносим всё влево: left - (right)
    const full = `(${left})-(${right})`;
    
    // Ищем коэффициенты a, b, c для x^2
    // Упрощённый подход — работает для стандартных случаев
    let a = 0, b = 0, c = 0;
    
    // Извлекаем x^2
    let m = full.match(/([+-]?\d*\.?\d*)x\^2/);
    if (m) {
      a = m[1] === '' || m[1] === '+' ? 1 : 
          m[1] === '-' ? -1 : parseFloat(m[1]);
    }
    
    // Извлекаем x (не x^2)
    let temp = full.replace(/[+-]?\d*\.?\d*x\^2/, '');
    m = temp.match(/([+-]?\d*\.?\d*)x(?!\^)/);
    if (m) {
      b = m[1] === '' || m[1] === '+' ? 1 : 
          m[1] === '-' ? -1 : parseFloat(m[1]);
    }
    
    // Свободный член — вычисляем остаток численно
    if (a !== 0) {
      // Подставляем x=0, x=1, x=2 для проверки, но проще — решить численно
      const f = (x) => a*x*x + b*x;
      // Свободный член = значение при x=0
      // Заменяем переменные для вычисления
      const evalAt = (xVal) => {
        let e = full.replace(/x\^2/g, `(${xVal}*${xVal})`)
                      .replace(/x/g, `(${xVal})`);
        e = prepareExpression(e);
        return Function('"use strict"; return (' + e + ')')();
      };
      c = evalAt(0);
      
      // Проверяем что это квадратное уравнение
      const check = evalAt(1) - (a + b + c);
      if (Math.abs(check) > 1e-6) {
        return null; // не квадратное
      }
    }
    
    return { a, b, c };
  } catch {
    return null;
  }
}

// ============ ОБЪЯСНЕНИЕ ШАГОВ ============
function explain(expr) {
  const steps = [];
  if (expr.includes('(')) steps.push('1️⃣ Скобки — вычисляем в первую очередь');
  if (expr.includes('^') || expr.includes('**')) steps.push('2️⃣ Степени — затем возведение в степень');
  if (/\*|\//.test(expr) && !expr.includes('sqrt')) steps.push('3️⃣ Умножение и деление — слева направо');
  if (expr.includes('!')) steps.push('⭐ Факториал — произведение чисел от 1 до n');
  if (/(sqrt|sin|cos|tan|log)/.test(expr)) steps.push('📐 Функции — сначала аргумент функции');
  if (/\+|\-/.test(expr.replace(/^\-/, ''))) steps.push('4️⃣ Сложение и вычитание — в последнюю очередь');
  return steps.length ? steps.join('<br>') : 'Это простое выражение — вычисляю напрямую';
}

// ============ ГЛАВНЫЙ ОБРАБОТЧИК ============
function processInput(text) {
  const t = text.trim();
  const lower = t.toLowerCase();
  
  // Объяснение
  if (lower.startsWith('объясни')) {
    const expr = t.slice(7).trim();
    return `📚 <b>Порядок действий:</b><br>${explain(expr)}<br><br>${solveExpression(expr).text}`;
  }
  
  // Уравнение
  if (t.includes('=') && /x/i.test(t)) {
    const q = parseQuadratic(t);
    if (q && q.a !== 0) {
      return `<b>Квадратное уравнение:</b> ${q.a}x² + ${q.b}x + ${q.c} = 0<br><br>` +
             solveQuadratic(q.a, q.b, q.c);
    }
    return '❌ Пока решаю только квадратные уравнения вида ax² + bx + c = 0<br>Например: x^2-5*x+6=0';
  }
  
  // Обычное выражение
  const res = solveExpression(t);
  return res.text;
}

// ============ ОТПРАВКА СООБЩЕНИЯ ============
function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  
  addMessage(text, 'user');
  input.value = '';
  
  // Небольшая задержка для эффекта "думает"
  setTimeout(() => {
    const response = processInput(text);
    const isError = response.startsWith('❌');
    addMessage(response, 'bot', isError ? 'error' : 'success');
  }, 300);
}

// Фокус на поле ввода
input.focus();
</script>

</body>
</html>
