<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФИТС v2.3 — ИИ по математике</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
    transition: background .4s;
  }
  body.dark { background: linear-gradient(135deg, #0f172a, #1e293b); }
  .chat {
    width: 100%; max-width: 640px; height: 88vh;
    background: #fff; border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    display: flex; flex-direction: column; overflow: hidden;
    transition: background .4s;
  }
  body.dark .chat { background: #1e293b; }
  .header {
    background: linear-gradient(135deg, #2a5298, #1e3c72);
    color: #fff; padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .avatar {
    width: 46px; height: 46px; background: #fff; color: #2a5298;
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-weight: bold; font-size: 18px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  .header h1 { font-size: 20px; }
  .header p { font-size: 12px; opacity: .85; }
  .messages {
    flex: 1; overflow-y: auto; padding: 20px;
    background: #f4f7fb; display: flex; flex-direction: column;
    gap: 12px; transition: opacity .35s ease, background .4s;
  }
  body.dark .messages { background: #0f172a; }
  .messages.clearing { opacity: 0; }
  .msg {
    max-width: 85%; padding: 12px 16px; border-radius: 16px;
    line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
    animation: fade .3s ease;
  }
  @keyframes fade { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:none;} }
  .bot {
    background: #fff; color: #1e3c72; align-self: flex-start;
    border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  body.dark .bot { background: #334155; color: #e2e8f0; }
  .user {
    background: #2a5298; color: #fff; align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .input-area {
    display: flex; padding: 14px; background: #fff;
    border-top: 1px solid #e0e6ef; gap: 10px;
    transition: background .4s;
  }
  body.dark .input-area { background: #1e293b; border-top-color: #475569; }
  .input-area input {
    flex: 1; padding: 12px 16px; border: 2px solid #e0e6ef;
    border-radius: 30px; font-size: 15px; outline: none;
    transition: border .2s;
  }
  body.dark .input-area input {
    background: #0f172a; color: #e2e8f0; border-color: #475569;
  }
  .input-area input:focus { border-color: #2a5298; }
  .input-area button {
    background: #2a5298; color: #fff; border: none;
    padding: 0 22px; border-radius: 30px; font-size: 15px;
    cursor: pointer; transition: background .2s;
  }
  .input-area button:hover { background: #1e3c72; }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: #c4d0e3; border-radius: 8px; }
</style>
</head>
<body>

<div class="chat">
  <div class="header">
    <div class="avatar">Ф</div>
    <div>
      <h1>ФИТС v2.3</h1>
      <p>ИИ по математике • только команды</p>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input id="input" type="text" placeholder="Команда или пример..." autocomplete="off">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
/* =========================================================
   🧠 ФИТС v2.3 — МОЗГ
   ========================================================= */
const FITS = {
  name: "ФИТС", version: "2.3",
  stats: { solved: 0, mistakes: 0, started: Date.now() },
  lastRiddle: null,
  darkMode: false,
  soundOn: false,
  prefixOn: true,
  stepsOn: false,

  help() {
    return `📚 КОМАНДЫ ФИТС v2.3

🧮 ПРИМЕРЫ: «2+2*3», «sqrt(16)», «sin(0)»
📝 ПОШАГОВО: «шаги 2+2*3»
📐 УРАВНЕНИЯ: «x+5=12», «2*x=10»
📐 КВАДРАТНЫЕ: «квадрат x^2-5x+6=0»

🔢 ЧИСЛА:
  «5!» — факториал
  «НОД 12 18», «НОК 4 6»
  «простое 17», «делители 12»
  «fib 10» — Фибоначчи

📏 ГЕОМЕТРИЯ:
  «круг 5», «прямоугольник 4 6»
  «треугольник 3 4 5»

💰 КОНВЕРТЕРЫ:
  «км 5», «градусы 90»
  «процент 20 от 500», «процент 15 из 60»

🎲 РАЗВЛЕЧЕНИЯ:
  «кубик», «монетка», «случайное 1 100»
  «угадай» — игра
  «загадка» / «ответ»
  «факт» — мат. факт

🛠 УТИЛИТЫ:
  «таблица 7», «степени 2»
  «статистика», «категории»
  «очистить» 🧹

⚙️ НАСТРОЙКИ-КОМАНДЫ:
  «тёмная тема» / «светлая тема»
  «звук вкл» / «звук выкл»
  «префикс вкл» / «префикс выкл»
  «шаги вкл» / «шаги выкл»`;
  },

  categories() {
    return `🗂 КАТЕГОРИИ:
🧮 Примеры • 📐 Уравнения • 🔢 Числа
📏 Геометрия • 💰 Конвертеры • 🎲 Игры
🛠 Утилиты • ⚙️ Настройки

Напиши «помощь» для подробностей.`;
  },

  extractExpression(text) {
    const eqMatch = text.match(/([\d\.\*\(\)\sxX]+)\s*=\s*([\d\.\*\(\)\s\+\-]+)/);
    if (eqMatch && /x/i.test(eqMatch[1]))
      return { type: "equation", value: eqMatch[0].replace(/\s+/g, "") };
    const factMatch = text.match(/(\d+)\s*!/);
    if (factMatch) return { type: "factorial", value: factMatch[1] };
    const exprPattern = /(?:sqrt|sin|cos|tan|log|abs|pi|\d|[+\-*/^().,\s])+/gi;
    const candidates = text.match(exprPattern) || [];
    let best = null;
    for (let c of candidates) {
      if (!/\d/.test(c)) continue;
      if (!/[+\-*/^]|sqrt|sin|cos|tan|log|abs|pi/i.test(c)) continue;
      if (c.replace(/\s/g, "").length < 2) continue;
      const cleaned = c.trim();
      if (!best || cleaned.length > best.length) best = cleaned;
    }
    if (best) return { type: "expr", value: best.trim() };
    return null;
  },

  calc(expr, showSteps = false) {
    try {
      let e = expr.replace(/\^/g, "**").replace(/,/g, ".")
        .replace(/pi/gi, "Math.PI").replace(/\be\b/g, "Math.E")
        .replace(/sqrt\(/gi, "Math.sqrt(")
        .replace(/sin\(/gi, "Math.sin(")
        .replace(/cos\(/gi, "Math.cos(")
        .replace(/tan\(/gi, "Math.tan(")
        .replace(/log\(/gi, "Math.log(")
        .replace(/abs\(/gi, "Math.abs(");
      if (!/^[0-9+\-*/().\sMathPIEsqrtincolgb]+$/.test(e))
        return "❌ Недопустимые символы.";
      const result = Function('"use strict"; return (' + e + ')')();
      if (typeof result !== "number" || !isFinite(result))
        return "❌ Не могу посчитать.";
      this.stats.solved++;
      const clean = Number.isInteger(result) ? result : Math.round(result * 1e10) / 1e10;
      let out = `✅ ${expr.trim()} = ${clean}`;
      if (showSteps) out = this.steps(expr) + "\n\n" + out;
      return out;
    } catch (err) {
      this.stats.mistakes++;
      return "❌ Не могу посчитать: " + err.message;
    }
  },

  steps(expr) {
    let s = expr.replace(/\s/g, "");
    const log = [`📝 Разбор: ${s}`];
    let step = 1;
    while (/\^/.test(s)) {
      s = s.replace(/(\d+(?:\.\d+)?)\^(\d+(?:\.\d+)?)/, (_, a, b) => {
        const r = Math.pow(+a, +b);
        log.push(`  ${step++}) ${a}^${b} = ${r}`); return r;
      });
      if (step > 50) break;
    }
    while (/[*/]/.test(s)) {
      s = s.replace(/(\d+(?:\.\d+)?)\s*([*/])\s*(\d+(?:\.\d+)?)/, (_, a, op, b) => {
        const r = op === "*" ? +a * +b : +a / +b;
        log.push(`  ${step++}) ${a} ${op} ${b} = ${r}`); return r;
      });
      if (step > 50) break;
    }
    while (/[+\-]/.test(s.replace(/^-/, ""))) {
      const before = s;
      s = s.replace(/(\d+(?:\.\d+)?)\s*([+\-])\s*(\d+(?:\.\d+)?)/, (_, a, op, b) => {
        const r = op === "+" ? +a + +b : +a - +b;
        log.push(`  ${step++}) ${a} ${op} ${b} = ${r}`); return r;
      });
      if (s === before) break;
    }
    return log.join("\n");
  },

  equation(eq) {
    try {
      const [left, right] = eq.split("=");
      const m = left.replace(/\s/g, "").match(/^([\d.]*)\*?x([+\-][\d.]+)?$/i);
      if (!m) return "❌ Пока ax+b=c. Пример: 2*x+5=11";
      const a = parseFloat(m[1] || "1");
      const b = m[2] ? parseFloat(m[2]) : 0;
      const c = Function('"use strict"; return (' + right + ')')();
      const x = (c - b) / a;
      const clean = Number.isInteger(x) ? x : Math.round(x * 1e6) / 1e6;
      this.stats.solved++;
      return `✅ ${eq}\n→ x = ${clean}`;
    } catch (err) { return "❌ Ошибка: " + err.message; }
  },

  quadratic(eq) {
    try {
      const clean = eq.replace(/\s/g, "").replace(/\^2/g, "²").toLowerCase();
      const m = clean.match(/([\d\-]*)x²([+\-][\d]*)x([+\-][\d]+)=0/);
      if (!m) return "❌ Пример: квадрат x^2-5x+6=0";
      const a = m[1] === "" ? 1 : m[1] === "-" ? -1 : +m[1];
      const b = m[2] === "+" ? 1 : m[2] === "-" ? -1 : +m[2];
      const c = +m[3];
      const D = b * b - 4 * a * c;
      let out = `📐 ${a}x² + ${b}x + ${c} = 0\nD = ${D}\n`;
      if (D < 0) return out + "❌ Корней нет";
      if (D === 0) return out + `✅ x = ${-b / (2*a)}`;
      const x1 = (-b + Math.sqrt(D)) / (2 * a);
      const x2 = (-b - Math.sqrt(D)) / (2 * a);
      this.stats.solved++;
      return out + `✅ x₁ = ${Math.round(x1*1e6)/1e6}\n✅ x₂ = ${Math.round(x2*1e6)/1e6}`;
    } catch (e) { return "❌ " + e.message; }
  },

  factorial(n) {
    n = parseInt(n);
    if (isNaN(n) || n < 0) return "❌ Только целые ≥ 0";
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return `✅ ${n}! = ${r}`;
  },
  gcd(a, b) {
    const A = a, B = b;
    a = Math.abs(parseInt(a)); b = Math.abs(parseInt(b));
    while (b) { [a, b] = [b, a % b]; }
    return `✅ НОД(${A},${B}) = ${a}`;
  },
  lcm(a, b) {
    const A = a, B = b;
    a = Math.abs(parseInt(a)); b = Math.abs(parseInt(b));
    let x = a, y = b;
    while (y) { [x, y] = [y, x % y]; }
    return `✅ НОК(${A},${B}) = ${a * b / x}`;
  },
  isPrime(n) {
    n = parseInt(n);
    if (n < 2) return `❌ ${n} — не простое`;
    for (let i = 2; i * i <= n; i++)
      if (n % i === 0) return `❌ ${n} — НЕ простое (делится на ${i})`;
    return `✅ ${n} — простое число`;
  },
  divisors(n) {
    n = Math.abs(parseInt(n));
    const d = [];
    for (let i = 1; i <= n; i++) if (n % i === 0) d.push(i);
    return `✅ Делители ${n}: ${d.join(", ")}`;
  },
  fibonacci(n) {
    n = parseInt(n);
    if (n > 50) return "❌ Максимум 50";
    const arr = [0, 1];
    for (let i = 2; i <= n; i++) arr.push(arr[i-1] + arr[i-2]);
    return `✅ F(${n}) = ${arr[n]}\n${arr.slice(0, n+1).join(", ")}`;
  },

  circle(r) {
    r = parseFloat(r);
    if (isNaN(r)) return "❌ Пример: круг 5";
    const s = Math.PI * r * r;
    return `✅ Круг r=${r}\nS = ${Math.round(s*1e4)/1e4}\nC = ${Math.round(2*Math.PI*r*1e4)/1e4}`;
  },
  rectangle(a, b) {
    return `✅ ${a}×${b}\nS = ${a*b}\nP = ${2*(+a + +b)}`;
  },
  triangle(a, b, c) {
    a = +a; b = +b; c = +c;
    const p = (a + b + c) / 2;
    const s = Math.sqrt(p * (p-a) * (p-b) * (p-c));
    if (isNaN(s)) return "❌ Такого треугольника нет";
    return `✅ Треугольник ${a},${b},${c}\nS = ${Math.round(s*1e4)/1e4}\nP = ${a+b+c}`;
  },

  toRadians(deg) { return `✅ ${deg}° = ${Math.round(deg*Math.PI/180*1e4)/1e4} рад`; },
  milesToKm(m) { return `✅ ${m} миль = ${Math.round(m*1.60934*100)/100} км`; },
  percentOf(p, t) { return `✅ ${p}% от ${t} = ${Math.round(p*t/100*1e6)/1e6}`; },
  percentIs(p, t) { return `✅ ${p} из ${t} = ${Math.round(p/t*100*1e4)/1e4}%`; },

  dice() { return `🎲 Выпало: ${1 + Math.floor(Math.random()*6)}`; },
  coin() { return `🪙 ${Math.random() < 0.5 ? "Орёл" : "Решка"}`; },
  random(a, b) {
    a = +a; b = +b;
    return `🎲 Случайное: ${a + Math.floor(Math.random()*(b-a+1))}`;
  },

  facts: [
    "Число π иррационально.",
    "0! = 1 по определению.",
    "1 — не простое число.",
    "Сумма углов треугольника = 180°.",
    "2 — единственное чётное простое.",
    "√2 — первое иррациональное число.",
    "1729 = 1³+12³ = 9³+10³ (Рамануджан).",
    "Простых чисел бесконечно много (Евклид).",
    "π ≈ 3.141592653589793",
    "e ≈ 2.718281828459045",
    "6 — первое совершенное число (1+2+3).",
    "Золотое сечение φ ≈ 1.618..."
  ],
  fact() { return "💡 " + this.facts[Math.floor(Math.random()*this.facts.length)]; },

  riddles: [
    { q: "2+2×2?", a: "6 (сначала умножение)" },
    { q: "0! = ?", a: "1" },
    { q: "10% от 50?", a: "5" },
    { q: "Сумма углов треугольника?", a: "180°" },
    { q: "√144 = ?", a: "12" },
    { q: "Простых чисел от 1 до 10?", a: "4 (2,3,5,7)" },
    { q: "2^10 = ?", a: "1024" }
  ],
  riddle() {
    const r = this.riddles[Math.floor(Math.random()*this.riddles.length)];
    this.lastRiddle = r;
    return `🧩 Загадка:\n${r.q}\n\n(напиши «ответ»)`;
  },
  answer() {
    if (!this.lastRiddle) return "🤔 Сначала «загадка»";
    const r = this.lastRiddle;
    this.lastRiddle = null;
    return `✅ Ответ: ${r.a}`;
  },

  multiplicationTable(n) {
    n = +n;
    let out = `📊 Таблица на ${n}:\n`;
    for (let i = 1; i <= 10; i++) out += `${n} × ${i} = ${n*i}\n`;
    return out;
  },
  powers(base, limit = 10) {
    base = +base;
    let out = `📈 Степени ${base}:\n`;
    for (let i = 0; i <= limit; i++) out += `${base}^${i} = ${Math.pow(base, i)}\n`;
    return out;
  },
  statistics() {
    const s = this.stats;
    const mins = Math.floor((Date.now() - s.started) / 60000);
    return `📊 Статистика:\n• Решено: ${s.solved}\n• Ошибок: ${s.mistakes}\n• В сети: ${mins} мин.\n• Версия: ${this.version}`;
  },

  commandSettings(low) {
    if (["тёмная тема","темная тема","тёмную тему","темную тему"].includes(low)) {
      this.darkMode = true;
      document.body.classList.add("dark");
      return "🌙 Тёмная тема включена!";
    }
    if (["светлая тема","светлую тему"].includes(low)) {
      this.darkMode = false;
      document.body.classList.remove("dark");
      return "☀️ Светлая тема включена!";
    }
    if (low === "тема") {
      this.darkMode = !this.darkMode;
      document.body.classList.toggle("dark", this.darkMode);
      return this.darkMode ? "🌙 Тёмная тема" : "☀️ Светлая тема";
    }
    if (["звук вкл","включить звук"].includes(low)) {
      this.soundOn = true; return "🔊 Звук включён!";
    }
    if (["звук выкл","выключить звук"].includes(low)) {
      this.soundOn = false; return "🔇 Звук выключен.";
    }
    if (low === "звук") {
      this.soundOn = !this.soundOn;
      return this.soundOn ? "🔊 Звук включён" : "🔇 Звук выключен";
    }
    if (["префикс вкл","префикс включить"].includes(low)) {
      this.prefixOn = true; return "🔎 Префикс включён!";
    }
    if (["префикс выкл","префикс выключить"].includes(low)) {
      this.prefixOn = false; return "🔕 Префикс выключен.";
    }
    if (low === "префикс") {
      this.prefixOn = !this.prefixOn;
      return this.prefixOn ? "🔎 Префикс включён" : "🔕 Префикс выключен";
    }
    if (["шаги вкл","шаги включить","пошагово вкл"].includes(low)) {
      this.stepsOn = true; return "📝 Пошаговое решение включено!";
    }
    if (["шаги выкл","шаги выключить","пошагово выкл"].includes(low)) {
      this.stepsOn = false; return "📝 Пошаговое решение выключено.";
    }
    if (low === "пошагово") {
      this.stepsOn = !this.stepsOn;
      return this.stepsOn ? "📝 Шаги включены" : "📝 Шаги выключены";
    }
    return null;
  },

  respond(msg) {
    const text = msg.trim();
    const low = text.toLowerCase();
    if (!text) return "Напиши что-нибудь 🙂";

    const sett = this.commandSettings(low);
    if (sett) return sett;

    if (["помощь","help","?"].includes(low)) return this.help();
    if (["категории","категория"].includes(low)) return this.categories();
    if (["статистика","stats"].includes(low)) return this.statistics();
    if (["факт","факты"].includes(low)) return this.fact();
    if (low === "загадка") return this.riddle();
    if (low === "ответ") return this.answer();
    if (["кубик","кости"].includes(low)) return this.dice();
    if (["монетка","монета"].includes(low)) return this.coin();

    if (["привет","здравствуй","хай","hello"].includes(low))
      return "Привет! Я ФИТС 🤖 «помощь» — команды!";
    if (low.includes("как дела")) return "Отлично! 📐";
    if (low.includes("спасибо")) return "Пожалуйста! 😊";
    if (["кто ты","что ты"].includes(low))
      return `Я ${this.name} v${this.version}. 30+ команд! «помощь».`;
    if (["пока","бай"].includes(low)) return "До встречи! 👋";

    const tryCmd = (re, fn) => { const m = low.match(re); return m ? fn(...m.slice(1)) : null; };
    let r;
    if ((r = tryCmd(/^круг\s*([\d.]+)/i, v => this.circle(v)))) return r;
    if ((r = tryCmd(/^прямоугольник\s+([\d.]+)\s+([\d.]+)/i, (a,b) => this.rectangle(a,b)))) return r;
    if ((r = tryCmd(/^треугольник\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/i, (a,b,c) => this.triangle(a,b,c)))) return r;
    if ((r = tryCmd(/^(?:квадрат|квадратное)\s+(.+)/i, v => this.quadratic(v)))) return r;
    if ((r = tryCmd(/^таблица\s+(\d+)/i, v => this.multiplicationTable(v)))) return r;
    if ((r = tryCmd(/^степени\s+(\d+)/i, v => this.powers(v)))) return r;
    if ((r = tryCmd(/^градусы\s+([\d.]+)/i, v => this.toRadians(v)))) return r;
    if ((r = tryCmd(/^км\s+([\d.]+)/i, v => this.milesToKm(v)))) return r;
    if ((r = tryCmd(/^процент\s+([\d.]+)\s+от\s+([\d.]+)/i, (p,t) => this.percentOf(p,t)))) return r;
    if ((r = tryCmd(/^процент\s+([\d.]+)\s+из\s+([\d.]+)/i, (p,t) => this.percentIs(p,t)))) return r;
    if ((r = tryCmd(/^случайное\s+(\d+)\s+(\d+)/i, (a,b) => this.random(a,b)))) return r;
    if ((r = tryCmd(/^(?:НОД|gcd)\s+(\d+)\s+(\d+)/i, (a,b) => this.gcd(a,b)))) return r;
    if ((r = tryCmd(/^(?:НОК|lcm)\s+(\d+)\s+(\d+)/i, (a,b) => this.lcm(a,b)))) return r;
    if ((r = tryCmd(/^простое\s+(\d+)/i, v => this.isPrime(v)))) return r;
    if ((r = tryCmd(/^делители\s+(\d+)/i, v => this.divisors(v)))) return r;
    if ((r = tryCmd(/^fib\s+(\d+)/i, v => this.fibonacci(v)))) return r;
    if ((r = tryCmd(/^шаги\s+(.+)/i, v => this.calc(v, true)))) return r;

    const found = this.extractExpression(text);
    if (found) {
      let prefix = "";
      const hasExtraWords = /[а-яё]/i.test(text.replace(/круг|sqrt|sin|cos|tan|log|abs|pi|шаги/gi, ""));
      if (hasExtraWords && this.prefixOn) prefix = "🔎 Нашёл пример:\n";
      if (found.type === "equation") return prefix + this.equation(found.value);
      if (found.type === "factorial") return prefix + this.factorial(found.value);
      return prefix + this.calc(found.value, this.stepsOn);
    }

    return `🤔 Не понял. Напиши «помощь» — список команд!`;
  }
};

/* =========================================================
   🔊 Звук
   ========================================================= */
let audioCtx = null;
function beep(freq = 800, dur = 0.05) {
  if (!FITS.soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch {}
}

/* =========================================================
   💬 ИНТЕРФЕЙС
   ========================================================= */
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
let guessGame = null;

function addMsg(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  beep(who === "user" ? 500 : 800, 0.05);
}

function clearChat() {
  messagesEl.classList.add("clearing");
  setTimeout(() => {
    messagesEl.innerHTML = "";
    messagesEl.classList.remove("clearing");
    addMsg("🧹 Чат очищен! Готов считать. «помощь» — команды.", "bot");
  }, 350);
}

function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  const low = text.toLowerCase();

  // 🎮 Игра «угадай»
  if (guessGame) {
    const n = parseInt(text);
    if (!isNaN(n)) {
      addMsg(text, "user");
      inputEl.value = "";
      let reply;
      if (n === guessGame.target) {
        reply = `🎉 Угадал! Это ${n}!\nПопыток: ${guessGame.tries + 1}`;
        guessGame = null;
      } else {
        guessGame.tries++;
        reply = n < guessGame.target ? "📈 Больше!" : "📉 Меньше!";
      }
      setTimeout(() => addMsg(reply, "bot"), 200);
      return;
    }
  }

  if (["угадай","угадай число","игра"].includes(low)) {
    addMsg(text, "user");
    inputEl.value = "";
    guessGame = { target: 1 + Math.floor(Math.random()*100), tries: 0 };
    setTimeout(() => addMsg("🎮 Загадал число 1–100. Пиши варианты!", "bot"), 250);
    return;
  }

  // 🧹 Очистка чата (без оверлея)
  if (["очистить","очисть","очисти","clear","clean"].includes(low)) {
    addMsg(text, "user");
    inputEl.value = "";
    setTimeout(clearChat, 200);
    return;
  }

  addMsg(text, "user");
  inputEl.value = "";
  setTimeout(() => addMsg(FITS.respond(text), "bot"), 250);
}

inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

/* =========================================================
   🚀 СТАРТ
   ========================================================= */
addMsg(
  `👋 Привет! Я ФИТС v${FITS.version} — управляюсь командами!\n\n` +
  `Попробуй:\n` +
  `  🧮 «2+2*3»\n` +
  `  📝 «шаги 2+2*3»\n` +
  `  📐 «квадрат x^2-5x+6=0»\n` +
  `  🎲 «кубик», «загадка», «угадай»\n` +
  `  🌙 «тёмная тема», 🔊 «звук вкл»\n\n` +
  `«помощь» — все команды!`,
  "bot"
);
