<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ по математике</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 600px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 90vh;
  }
  header {
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: #fff;
    padding: 18px 20px;
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header small { font-weight: 400; opacity: .8; font-size: 12px; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #f5f7fb;
  }
  .msg {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 16px;
    margin-bottom: 12px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user { background: #667eea; color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .bot  { background: #fff; color: #222; border: 1px solid #e3e8f0; border-bottom-left-radius: 4px; }
  .bot b { color: #764ba2; }
  .input-area {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #fff;
    border-top: 1px solid #e3e8f0;
  }
  #input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e3e8f0;
    border-radius: 24px;
    font-size: 15px;
    outline: none;
  }
  #input:focus { border-color: #667eea; }
  button {
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    padding: 0 22px;
    border-radius: 24px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: .9; }
  .hints {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 8px 12px;
    background: #fafbff;
    border-top: 1px solid #e3e8f0;
  }
  .hints button {
    background: #eef1ff;
    color: #5560c8;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 12px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    🧮 ИИ по математике
    <small>локальный · без интернета</small>
  </header>

  <div id="chat">
    <div class="msg bot">Привет! Я математический ИИ. Пиши примеры, уравнения или задачи.<br><br>Например: <b>2+2*3</b>, <b>sin(pi/2)</b>, <b>sqrt(16)</b>, <b>2^10</b>, <b>log(100)</b>, <b>5!</b></div>
  </div>

  <div class="hints">
    <button onclick="ask('2+2*3')">2+2*3</button>
    <button onclick="ask('sqrt(144)')">sqrt(144)</button>
    <button onclick="ask('sin(pi/2)')">sin(pi/2)</button>
    <button onclick="ask('2^10')">2^10</button>
    <button onclick="ask('log(100)')">log(100)</button>
    <button onclick="ask('5!')">5!</button>
  </div>

  <div class="input-area">
    <input id="input" placeholder="Введи пример или задачу..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
/* ============================================
   🧠 МИНИ-ИИ ПО МАТЕМАТИКЕ
   - Понимает арифметику, функции, факториал
   - Решает уравнения вида 2x+5=13
   - Объясняет шаги
   ============================================ */

const chat = document.getElementById('chat');
const input = document.getElementById('input');

function ask(text) { input.value = text; send(); }

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  setTimeout(() => {
    const answer = solve(text);
    addMsg(answer, 'bot');
  }, 300);
}

/* ---------- ПАРСЕР И ВЫЧИСЛИТЕЛЬ ---------- */

// Безопасный вычислитель выражений (замена eval)
function evaluate(expr) {
  expr = expr.replace(/,/g, '.');
  // заменяем ^ на **
  expr = expr.replace(/\^/g, '**');

  // факториал: 5! -> factorial(5)
  expr = expr.replace(/(\d+)!/g, 'fact($1)');

  // константы
  expr = expr.replace(/\bpi\b/gi, 'Math.PI');
  expr = expr.replace(/\be\b/g, 'Math.E');

  // функции
  expr = expr.replace(/\bsqrt\s*\(/gi, 'Math.sqrt(');
  expr = expr.replace(/\bsin\s*\(/gi, 'Math.sin(');
  expr = expr.replace(/\bcos\s*\(/gi, 'Math.cos(');
  expr = expr.replace(/\btan\s*\(/gi, 'Math.tan(');
  expr = expr.replace(/\basin\s*\(/gi, 'Math.asin(');
  expr = expr.replace(/\bacos\s*\(/gi, 'Math.acos(');
  expr = expr.replace(/\batan\s*\(/gi, 'Math.atan(');
  expr = expr.replace(/\blog\s*\(/gi, 'Math.log10(');
  expr = expr.replace(/\bln\s*\(/gi, 'Math.log(');
  expr = expr.replace(/\babs\s*\(/gi, 'Math.abs(');
  expr = expr.replace(/\bexp\s*\(/gi, 'Math.exp(');

  // проверка на безопасность: только цифры, операторы, Math., fact
  if (!/^[0-9+\-*/().\s,MathPIEsqrtincos talgbxpf!]*$/i.test(expr)) {
    // мягкая проверка — отсекаем явные атаки
    if (/[a-zA-Z]/.test(expr.replace(/Math\.\w+|fact/g, ''))) {
      throw new Error('Недопустимые символы');
    }
  }

  const fact = n => (n < 0 ? NaN : n <= 1 ? 1 : n * fact(n - 1));

  // eslint-disable-next-line no-new-func
  const fn = new Function('fact', 'return (' + expr + ');');
  return fn(fact);
}

/* ---------- РЕШЕНИЕ УРАВНЕНИЙ ax + b = c ---------- */
function solveLinear(input) {
  // убираем пробелы
  let s = input.replace(/\s+/g, '').toLowerCase();
  // должно быть ровно одно '='
  if ((s.match(/=/g) || []).length !== 1) return null;

  let [left, right] = s.split('=');

  // переносим всё влево: left - right = 0
  const expr = `(${left})-(${right})`;

  // пробуем найти x через численный метод (бисекция) — универсально
  // Сначала проверим, что в выражении есть x
  if (!expr.includes('x')) return null;

  // заменим x на переменную для функции
  const f = (x) => {
    const e = expr.replace(/x/g, `(${x})`);
    return evaluate(e);
  };

  // ищем корень бисекцией в диапазоне [-1000, 1000]
  let a = -1000, b = 1000;
  let fa = f(a), fb = f(b);
  if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) {
    // попробуем меньший диапазон
    a = -100; b = 100; fa = f(a); fb = f(b);
    if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
  }
  for (let i = 0; i < 100; i++) {
    const m = (a + b) / 2;
    const fm = f(m);
    if (Math.abs(fm) < 1e-10) { a = b = m; break; }
    if (fa * fm < 0) { b = m; fb = fm; }
    else { a = m; fa = fm; }
  }
  let x = (a + b) / 2;
  x = Math.round(x * 1e6) / 1e6;

  return `Решим уравнение: <b>${input.trim()}</b><br><br>
  Перенесём всё в одну сторону: <code>${left} - (${right}) = 0</code><br>
  Найдём <b>x</b> численным методом...<br><br>
  ✅ <b>x = ${x}</b>`;
}

/* ---------- ГЛАВНЫЙ МОЗГ ---------- */
function solve(text) {
  const t = text.trim();

  // 1) уравнение?
  if (t.includes('=') && /x/i.test(t)) {
    const r = solveLinear(t);
    if (r) return r;
  }

  // 2) просто выражение
  try {
    const val = evaluate(t);
    if (!isFinite(val)) return '⚠️ Результат не является числом (деление на ноль?).';
    const rounded = Math.round(val * 1e10) / 1e10;
    return `Выражение: <code>${t}</code><br><br>✅ <b>Ответ: ${rounded}</b>`;
  } catch (err) {
    return `🤔 Не смог распознать. Попробуй так:<br>
    • <b>2+2*3</b><br>
    • <b>sqrt(16)</b><br>
    • <b>sin(pi/2)</b><br>
    • <b>2x + 5 = 13</b><br>
    • <b>log(100)</b>`;
  }
}
</script>
</body>
</html>
